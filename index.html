<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Johanna Uroh | Growth & Impact</title>
    <meta name="description" content="Virtual Assistant, Social Media Manager, and Stock Trading Coach." />
    
    <!-- Google Fonts: Playfair Display (Luxury) and Manrope (Efficiency/Modern) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Semantic Mapping: 
              navy: 'var(--bg-main)',
              'navy-light': 'var(--bg-secondary)',
              
              // Text Semantics
              white: 'var(--text-main)', // Maps to Black in Light Mode
              secondary: 'var(--text-secondary)',
              muted: 'var(--text-muted)',
              
              // Borders
              dim: 'var(--border-dim)',

              gold: 'var(--accent)',
              'gold-light': 'var(--accent-light)',
              
              // Utility for static colors
              'pure-white': '#ffffff',
              'pure-black': '#000000',
              grey: '#F4F6F8',
            },
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            }
          }
        }
      }
    </script>
</head>
  <body class="bg-navy text-white antialiased overflow-x-hidden selection:bg-gold selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
